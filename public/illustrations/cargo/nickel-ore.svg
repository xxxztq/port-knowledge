<svg xmlns="http://www.w3.org/2000/svg" id="c-nickel-ore" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="c-nickel-ore-title c-nickel-ore-desc">
  <title id="c-nickel-ore-title">镍矿：土块状矿料示例、货况与环境、取样记录关联</title>
  <desc id="c-nickel-ore-desc">采用土块状红土镍矿的代表性形态，画出有顶棚的货堆、棚外天气符号、样品容器及货况记录。镍矿并非全部具有相同外观；天气符号只说明环境与货况记录的联系，不示范防雨操作，不给出含水量阈值或固定运输分类。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
