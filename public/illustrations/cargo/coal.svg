<svg xmlns="http://www.w3.org/2000/svg" id="c-coal" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="c-coal-title c-coal-desc">
  <title id="c-coal-title">煤炭：封闭堆场示例、带罩转运与样品、批次与状态记录</title>
  <desc id="c-coal-desc">以拱形封闭堆场中的块粒煤、带罩皮带转运和独立状态记录示意煤炭港口业务。折线只是监测记录的概念符号，无数值、阈值或固定分类；不表示通风、灭火或装卸工艺步骤，罩体以局部示意表达。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
