<svg xmlns="http://www.w3.org/2000/svg" id="cargo-steel-coil" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="coil-title coil-desc">
  <title id="coil-title">卷钢：包装、卷号与支承关系</title>
  <desc id="coil-desc">原创技术线稿。一卷有外包装与端面护边的卷钢置于有顶棚场地内，卷孔开口可见，外侧附虚构卷号C-017。卷体由独立鞍形承托离地支承，旁边资料卡对应包装状态、承托和场地核对。图示不表示裸卷露天落地，不提供承托尺寸、绑扎、吊装或装载方法。承托仅表达关系，实际方案须按货物与场地条件确认。教学示意，不按比例。</desc>
  <defs>
    <style>
      #cargo-steel-coil text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#202827}
      #cargo-steel-coil .heading{font-size:20px;font-weight:600}
      #cargo-steel-coil .label{font-size:14px}
      #cargo-steel-coil .small{font-size:12px}
      #cargo-steel-coil .muted{fill:#596360}
      #cargo-steel-coil .ink{fill:none;stroke:#202827;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      #cargo-steel-coil .fine{fill:none;stroke:#7a8580;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
      #cargo-steel-coil .faint{fill:none;stroke:#b9bdb5;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
      #cargo-steel-coil .paper{fill:#f7f5ef}
      #cargo-steel-coil .shade{fill:#e5e8df}
      #cargo-steel-coil .number{font:600 12px Arial,sans-serif;fill:#285b56;text-anchor:middle}
    </style>
  </defs>
