<svg xmlns="http://www.w3.org/2000/svg" id="c-bauxite" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="c-bauxite-title c-bauxite-desc">
  <title id="c-bauxite-title">铝土矿：块粒状矿料、分批货堆、样品与成分记录</title>
  <desc id="c-bauxite-desc">两组块粒状铝土矿货堆以虚构批次A、B区分，样品容器与成分和重量记录相对应。教学重点是不同批次矿料与记录关联；颗粒大小、颜色与湿润程度在实际货物间存在差异，本图不提供货物运输分类或判断标准。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
