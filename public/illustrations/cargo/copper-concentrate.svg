<svg xmlns="http://www.w3.org/2000/svg" id="c-copper-concentrate" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="c-copper-concentrate-title c-copper-concentrate-desc">
  <title id="c-copper-concentrate-title">铜精矿：细粒精矿、对应样品、计量与化验</title>
  <desc id="c-copper-concentrate-desc">以封闭仓局部剖视中的细粒货堆表示铜精矿，与独立样品容器、重量及化验记录关联。铜精矿是矿物加工后的精矿，不以铜锭或金属铜块代替；画面不表示仓储条件、含水量、品位阈值或运输分类。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
