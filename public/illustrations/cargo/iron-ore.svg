<svg xmlns="http://www.w3.org/2000/svg" id="c-iron-ore" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="c-iron-ore-title c-iron-ore-desc">
  <title id="c-iron-ore-title">铁矿石：散装到港、接料与转运、矿石批次堆存</title>
  <desc id="c-iron-ore-desc">左侧散货船内的块粉状铁矿石与卸船设备相连，中部接料斗和皮带表达转运关系，右侧矿石货堆旁有批次记录。货堆仅表达散货形态，设备与船舶不按比例，图中装卸关系不表示实际作业流程或工艺参数。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
