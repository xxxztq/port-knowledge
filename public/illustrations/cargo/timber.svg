<svg xmlns="http://www.w3.org/2000/svg" id="cargo-timber" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="timber-title timber-desc">
  <title id="timber-title">木材：原木、成捆锯材与货签交接</title>
  <desc id="timber-desc">原创技术线稿。左侧原木端面以年轮和径向纹理辨识，中间锯材成捆、附有货签并离地承放，右侧两名工作人员在独立核签台核对批次和件数。T-01与S-02为虚构货签。图中没有起吊或移运中的货物，不表示实际堆放、捆扎或支承方案，不提供工程尺寸。教学示意，不按比例。</desc>
