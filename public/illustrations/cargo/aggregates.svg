<svg xmlns="http://www.w3.org/2000/svg" id="c-aggregates" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="c-aggregates-title c-aggregates-desc">
  <title id="c-aggregates-title">砂石骨料：规格分区示例、车辆与衡器、交接计量记录</title>
  <desc id="c-aggregates-desc">分隔料仓中的细料、粒料和块料用于说明砂石骨料按货物规格与批次分区，右侧自卸车辆位于示意衡器上并连接计量终端。粒级文字为概念性区分，不给出粒径标准；车辆与货仓不按比例，不表示装载量或实际称重操作。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
