<svg xmlns="http://www.w3.org/2000/svg" id="c-phosphate-rock" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="c-phosphate-rock-title c-phosphate-rock-desc">
  <title id="c-phosphate-rock-title">磷矿石：封闭仓型示例、矿料形态放大、样品与原料批次</title>
  <desc id="c-phosphate-rock-desc">以代表性的封闭料仓、局部放大块粉状矿料、样品和原料批次记录表达磷矿石运输与工业原料管理关系。右侧货堆为形态说明插图，不表示料仓外实际漏料或露天存放；块矿、粉矿及加工形态不同，仓型不是固定要求。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
