<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="berthing-overview-title" aria-describedby="berthing-overview-desc" lang="zh-CN">
  <title id="berthing-overview-title">船舶进港与靠泊空间总览</title>
  <desc id="berthing-overview-desc">原创深青线稿，米白底。由左至右画出海上进近、引航登轮区、航道、回旋水域和岸边泊位，右侧有码头、靠泊船舶、护舷、系缆设施与按需使用的小拖轮。锚地位于主通路上方，通过虚线支路相连。锚地是按条件选用的候泊位置，非所有船舶必经。非比例教学图，连线只表达空间联系，不表示固定航迹或航行操纵程序；实际航路与引航登轮点依港口和当时条件确定。</desc>
  <defs>
    <marker id="berthing-overview-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
