    <text x="32" y="38" font-size="23" font-weight="600">从海上进近，到船岸交接</text>
    <text x="968" y="36" text-anchor="end" font-size="14">非比例教学图</text>
    <path d="M32 59H968M32 381H968" fill="none" stroke="#b9c4bc" />

