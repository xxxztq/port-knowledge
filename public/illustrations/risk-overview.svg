<svg xmlns="http://www.w3.org/2000/svg" id="risk-overview" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="risk-title risk-desc">
  <title id="risk-title">港口空间风险总览：六类观察要素</title>
  <desc id="risk-desc">原创港口全景技术线稿，用六个数字对应观察要素：01岸边设备，02有标识的货物，03独立车道中的车辆，04码头水边，05天气与观测设施，06控制室。左侧岸桥空吊具下方无人、无吊物；货物静置，车辆与控制室分区。水面、岸线、棚外观测杆和室内显示屏表达空间及信息联系。所有布局均为教学抽象，不表示实际工程尺寸、安全距离、交通组织或现场操作方案。教学示意，不按比例。</desc>
  <defs>
    <style>
      #risk-overview text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#202827}
      #risk-overview .heading{font-size:20px;font-weight:600}
      #risk-overview .label{font-size:14px}
      #risk-overview .small{font-size:12px}
      #risk-overview .muted{fill:#596360}
      #risk-overview .ink{fill:none;stroke:#202827;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      #risk-overview .fine{fill:none;stroke:#7a8580;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
      #risk-overview .faint{fill:none;stroke:#b9bdb5;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
      #risk-overview .paper{fill:#f7f5ef}
      #risk-overview .shade{fill:#e5e8df}
      #risk-overview .accent{fill:#285b56}
      #risk-overview .number{font:600 12px Arial,sans-serif;fill:#285b56;text-anchor:middle}
    </style>
  </defs>
  <rect width="720" height="360" class="paper"/>
