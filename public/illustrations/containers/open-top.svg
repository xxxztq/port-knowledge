<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="open-top-title open-top-desc">
<title id="open-top-title">开顶集装箱｜原创结构线稿</title>
<desc id="open-top-desc">箱体保留波纹侧壁、端门和完整顶框；顶部呈开放区域，后侧示意卷起篷布，一根顶弓以虚线表示移开。并非全部开顶箱都超高。 结构教学示意，非工程图，不用于测量或吊装设计。</desc>
<!-- 原创矢量线稿；2026-11-22；依据公开结构概念重新绘制，未复制来源图片。 -->
