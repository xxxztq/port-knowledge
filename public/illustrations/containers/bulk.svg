<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="bulk-title bulk-desc">
<title id="bulk-title">干散货集装箱｜原创结构线稿</title>
<desc id="bulk-desc">箱顶可见三个圆形装料口，右端下部为独立卸料口。此图是一种干散货设备配置，不代表全部散货箱都可加压或倾翻卸料。 结构教学示意，非工程图，不用于测量或吊装设计。</desc>
