<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="open-side-title open-side-desc">
<title id="open-side-title">侧开门集装箱｜原创结构线稿</title>
<desc id="open-side-desc">固定顶板和端门仍在，长侧面的四片刚性门扇折向两侧，展示侧向装载开口及回转空间。表示装卸状态，运输时须恢复闭锁；不表示侧帘型设备。 结构教学示意，非工程图，不用于测量或吊装设计。</desc>
<!-- 原创矢量线稿；2026-11-22；依据公开结构概念重新绘制，未复制来源图片。 -->
<rect width="480" height="280" fill="#f7f5ef"/>
<g fill="#222222" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="22" y="28" font-size="17" font-weight="700">OS · 侧开门箱</text><text x="22" y="48" font-size="12" fill="#285b58">保留固定顶板，门扇从长侧面展开</text><text x="458" y="28" font-size="11" text-anchor="end">12 / 12</text></g>
