<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="flat-rack-title flat-rack-desc">
<title id="flat-rack-title">框架集装箱｜原创结构线稿</title>
<desc id="flat-rack-desc">厚底架、两端立起的框架、开放侧面和系固环。未绘货物，以突出框架箱与仅有平台的差别；不暗示任何通用吊装方案。 结构教学示意，非工程图，不用于测量或吊装设计。</desc>
<!-- 原创矢量线稿；2026-11-22；依据公开结构概念重新绘制，未复制来源图片。 -->
<rect width="480" height="280" fill="#f7f5ef"/>
