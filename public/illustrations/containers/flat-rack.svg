<g fill="none" stroke="#222222" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><polygon points="40,199 92,171 432,171 380,199" fill="#ffffff"/><polygon points="40,199 380,199 380,210 40,210" fill="#ffffff"/><polygon points="380,199 432,171 432,182 380,210" fill="#ffffff"/><polygon points="40,199 40,106 92,78 92,171 84,175 84,91 48,110 48,199" fill="#ffffff"/><polygon points="40,106 92,78 92,91 48,114" fill="#ffffff"/><polygon points="380,199 380,106 432,78 432,171 424,175 424,91 388,110 388,199" fill="#ffffff"/><polygon points="380,106 432,78 432,91 388,114" fill="#ffffff"/><ellipse cx="55" cy="204" rx="3" ry="2" stroke="#285b58"/><ellipse cx="110" cy="204" rx="3" ry="2" stroke="#285b58"/><ellipse cx="165" cy="204" rx="3" ry="2" stroke="#285b58"/><ellipse cx="220" cy="204" rx="3" ry="2" stroke="#285b58"/><ellipse cx="275" cy="204" rx="3" ry="2" stroke="#285b58"/><ellipse cx="330" cy="204" rx="3" ry="2" stroke="#285b58"/><ellipse cx="365" cy="204" rx="3" ry="2" stroke="#285b58"/><line x1="106" y1="190" x2="361" y2="190" stroke-width="1"/><text x="240" y="143" stroke="none" fill="#285b58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" text-anchor="middle">无固定侧壁、无箱顶</text><text x="240" y="246" stroke="none" fill="#285b58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" text-anchor="middle">端框立起 · 底架承载 · 系固点</text></g>
