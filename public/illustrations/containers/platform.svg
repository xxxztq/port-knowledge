<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="platform-title platform-desc">
<title id="platform-title">平台集装箱｜原创结构线稿</title>
<desc id="platform-desc">独立低矮承载平台，有角件、底架梁和系固环，没有立起的端框、侧壁或顶板。与框架箱分开表示。 结构教学示意，非工程图，不用于测量或吊装设计。</desc>
<!-- 原创矢量线稿；2026-11-22；依据公开结构概念重新绘制，未复制来源图片。 -->
<rect width="480" height="280" fill="#f7f5ef"/>
