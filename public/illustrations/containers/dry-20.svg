<title id="dry-20-title">20 英尺普通干货箱｜原创结构线稿</title>
<desc id="dry-20-desc">较短的封闭箱体，波纹侧壁、固定顶板和右侧双扇端门。采用与 40 英尺普通箱相同的高度和视角，侧面长度约为其一半。 结构教学示意，非工程图，不用于测量或吊装设计。</desc>
