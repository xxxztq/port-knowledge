    <use href="#yard-box" x="505" y="169"/>
    <use href="#yard-box" x="505" y="145"/>
    <use href="#yard-box" x="489" y="197"/>
    <use href="#yard-box" x="489" y="173"/>

    <!-- 轨道门架不标注自动化等级；外形不能证明自动化程度。 -->
    <path class="ink paper" d="M449 96 471 82H654L632 96Z"/>
    <path class="ink shade" d="M632 96 654 82V96L632 110Z"/>
    <path class="ink paper" d="M449 96H632V110H449Z"/>
    <path class="ink paper" d="M451 110H460L449 207H438ZM620 110H629L618 207H607Z"/>
    <path class="ink shade" d="M647 100H654L644 163H637Z"/>
    <path class="fine" d="M463 101H615M461 103 470 96M479 103 488 96M497 103 506 96M515 103 524 96M533 103 542 96M551 103 560 96M569 103 578 96M587 103 596 96M605 103 614 96"/>
    <path class="ink shade" d="M524 102H549V115H524Z"/>
    <path class="ink" d="M529 115V139M544 115V139M520 140H553"/>
    <path class="ink shade" d="M433 207H452V214H433ZM602 207H621V214H602ZM633 163H647V169H633Z"/>
    <circle class="ink paper" cx="438" cy="216" r="3"/>
    <circle class="ink paper" cx="447" cy="216" r="3"/>
    <circle class="ink paper" cx="607" cy="216" r="3"/>
    <circle class="ink paper" cx="616" cy="216" r="3"/>

    <!-- 前方车辆交接只示位置关系，不代表端部交接工程布置。 -->
    <path class="lane" d="M390 279H687M464 243H587V273H464Z"/>
    <use href="#yard-box" transform="translate(488 241) scale(.72)"/>
    <path class="ink shade" d="M480 261H547L555 255H549L541 258H480Z"/>
    <path class="ink paper" d="M462 243H478V261H456V253Z"/>
    <path class="fine" d="M464 247H474V253H460"/>
    <path class="ink" d="M478 258H485"/>
    <use href="#yard-wheel" x="463" y="265"/>
    <use href="#yard-wheel" x="502" y="265"/>
    <use href="#yard-wheel" x="534" y="265"/>
  </g>

  <text class="caption" x="181" y="312" text-anchor="middle">箱列 · 行车通道 · 底盘停放</text>
  <text class="caption" x="539" y="312" text-anchor="middle">固定轨道 · 箱列 · 交接位置</text>
  <text class="note" x="360" y="342" text-anchor="middle">教学示意，非工程图 · 布局可并存，自动化程度另看配置</text>
</svg>
