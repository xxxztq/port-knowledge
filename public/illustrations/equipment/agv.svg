  <title id="equipment-agv-title">自动导引运输车 · 教学示意，非工程图</title>
  <desc id="equipment-agv-desc">无驾驶室的低矮自动导引运输平台承载集装箱，以轮组、平台端部感知部件与下方虚线路径辨认。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-agv；不含尺寸、型号或额定能力。</metadata>
