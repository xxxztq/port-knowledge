  <title id="equipment-pump-tank-title">泵管罐系统 · 教学示意，非工程图</title>
  <desc id="equipment-pump-tank-desc">液货教学连接示意：左侧船岸装卸接口经管线连接泵及驱动，经过阀门与计量示意后进入右侧立式储罐；不代表工艺设计。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-pump-tank；不含尺寸、型号或额定能力。</metadata>
