  <title id="equipment-reachstacker-title">正面吊 · 教学示意，非工程图</title>
  <desc id="equipment-reachstacker-desc">正面吊侧视结构，斜向伸缩臂从带驾驶室的轮式底盘伸出，顶部吊具连接右侧悬起的箱体。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-reachstacker；不含尺寸、型号或额定能力。</metadata>
