<svg xmlns="http://www.w3.org/2000/svg" id="equipment-rtg" width="800" height="480" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="equipment-rtg-title equipment-rtg-desc">
  <title id="equipment-rtg-title">轮胎式场桥 · 教学示意，非工程图</title>
  <desc id="equipment-rtg-desc">透视门架跨越箱堆与车辆通道，近景清楚显示成组橡胶轮胎，梁下吊具悬挂一个集装箱。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-rtg；不含尺寸、型号或额定能力。</metadata>
  <style>
    #equipment-rtg { color: #252624; }
    #equipment-rtg path, #equipment-rtg rect, #equipment-rtg circle, #equipment-rtg polygon, #equipment-rtg ellipse { stroke: #252624; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    #equipment-rtg .line { fill: none; }
    #equipment-rtg .fine { fill: none; stroke: #656660; stroke-width: .85; }
    #equipment-rtg .paper { fill: #faf9f6; }
    #equipment-rtg .pale { fill: #efeee9; }
    #equipment-rtg .shade { fill: #d8d9d2; }
    #equipment-rtg .mid { fill: #969992; }
    #equipment-rtg .dark { fill: #363834; }
    #equipment-rtg .ground { fill: none; stroke: #a8aaa2; stroke-width: .85; }
    #equipment-rtg .water { fill: none; stroke: #92968e; stroke-width: .85; }
    #equipment-rtg .route { fill: none; stroke: #92968e; stroke-width: 1; }
    #equipment-rtg .leader { fill: none; stroke: #888c83; stroke-width: 1; }
    #equipment-rtg .material { fill: none; stroke: #646860; stroke-width: 3; }
    #equipment-rtg .pipe { fill: none; stroke: #353832; stroke-width: 10; }
    #equipment-rtg .pipe-inner { fill: none; stroke: #eeeee8; stroke-width: 6.5; }
    #equipment-rtg .paper-line { fill: none; stroke: #faf9f6; stroke-width: 1; }
    #equipment-rtg .marker { fill: #faf9f6; stroke: #252624; stroke-width: 1.5; }
    #equipment-rtg .number { fill: #252624; font: 600 13px Arial, sans-serif; text-anchor: middle; }
  </style>
