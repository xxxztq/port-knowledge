  <title id="equipment-sts-title">岸桥 · 教学示意，非工程图</title>
  <desc id="equipment-sts-desc">侧向展开的集装箱岸桥：外伸臂架跨过船舶，绳索下悬吊具与箱体，门架下方安排岸侧车辆。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-sts；不含尺寸、型号或额定能力。</metadata>
