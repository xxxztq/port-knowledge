    #equipment-ship-unloader .water { fill: none; stroke: #92968e; stroke-width: .85; }
    #equipment-ship-unloader .route { fill: none; stroke: #92968e; stroke-width: 1; }
    #equipment-ship-unloader .leader { fill: none; stroke: #888c83; stroke-width: 1; }
    #equipment-ship-unloader .material { fill: none; stroke: #646860; stroke-width: 3; }
    #equipment-ship-unloader .pipe { fill: none; stroke: #353832; stroke-width: 10; }
    #equipment-ship-unloader .pipe-inner { fill: none; stroke: #eeeee8; stroke-width: 6.5; }
    #equipment-ship-unloader .paper-line { fill: none; stroke: #faf9f6; stroke-width: 1; }
    #equipment-ship-unloader .marker { fill: #faf9f6; stroke: #252624; stroke-width: 1.5; }
    #equipment-ship-unloader .number { fill: #252624; font: 600 13px Arial, sans-serif; text-anchor: middle; }
