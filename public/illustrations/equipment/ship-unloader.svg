<svg xmlns="http://www.w3.org/2000/svg" id="equipment-ship-unloader" width="800" height="480" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="equipment-ship-unloader-title equipment-ship-unloader-desc">
  <title id="equipment-ship-unloader-title">卸船机 · 教学示意，非工程图</title>
  <desc id="equipment-ship-unloader-desc">抓斗式散货卸船机跨在船舱与岸侧之间，钢索悬挂双瓣抓斗，岸侧漏斗下接水平输送机。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-unloader；不含尺寸、型号或额定能力。</metadata>
