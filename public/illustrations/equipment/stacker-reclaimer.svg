<svg xmlns="http://www.w3.org/2000/svg" id="equipment-stacker-reclaimer" width="800" height="480" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="equipment-stacker-reclaimer-title equipment-stacker-reclaimer-desc">
  <title id="equipment-stacker-reclaimer-title">堆取料机 · 教学示意，非工程图</title>
  <desc id="equipment-stacker-reclaimer-desc">斗轮式堆取料设备教学外形，长臂架连接右侧斗轮与中央机体，背部设平衡结构，下方与堆场输送线连接。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-stacker；不含尺寸、型号或额定能力。</metadata>
  <style>
    #equipment-stacker-reclaimer { color: #252624; }
    #equipment-stacker-reclaimer path, #equipment-stacker-reclaimer rect, #equipment-stacker-reclaimer circle, #equipment-stacker-reclaimer polygon, #equipment-stacker-reclaimer ellipse { stroke: #252624; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
    #equipment-stacker-reclaimer .line { fill: none; }
    #equipment-stacker-reclaimer .fine { fill: none; stroke: #656660; stroke-width: .85; }
    #equipment-stacker-reclaimer .paper { fill: #faf9f6; }
    #equipment-stacker-reclaimer .pale { fill: #efeee9; }
    #equipment-stacker-reclaimer .shade { fill: #d8d9d2; }
    #equipment-stacker-reclaimer .mid { fill: #969992; }
    #equipment-stacker-reclaimer .dark { fill: #363834; }
    #equipment-stacker-reclaimer .ground { fill: none; stroke: #a8aaa2; stroke-width: .85; }
    #equipment-stacker-reclaimer .water { fill: none; stroke: #92968e; stroke-width: .85; }
    #equipment-stacker-reclaimer .route { fill: none; stroke: #92968e; stroke-width: 1; }
    #equipment-stacker-reclaimer .leader { fill: none; stroke: #888c83; stroke-width: 1; }
    #equipment-stacker-reclaimer .material { fill: none; stroke: #646860; stroke-width: 3; }
    #equipment-stacker-reclaimer .pipe { fill: none; stroke: #353832; stroke-width: 10; }
    #equipment-stacker-reclaimer .pipe-inner { fill: none; stroke: #eeeee8; stroke-width: 6.5; }
    #equipment-stacker-reclaimer .paper-line { fill: none; stroke: #faf9f6; stroke-width: 1; }
    #equipment-stacker-reclaimer .marker { fill: #faf9f6; stroke: #252624; stroke-width: 1.5; }
    #equipment-stacker-reclaimer .number { fill: #252624; font: 600 13px Arial, sans-serif; text-anchor: middle; }
  </style>
