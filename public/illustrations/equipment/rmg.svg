  <title id="equipment-rmg-title">轨道式场桥 · 教学示意，非工程图</title>
  <desc id="equipment-rmg-desc">带侧向悬臂的轨道式门架，细小钢轮落在两列轨道上，箱区与侧面车辆交接位置并列。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-rmg；不含尺寸、型号或额定能力。</metadata>
