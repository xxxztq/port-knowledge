    #equipment-rmg .leader { fill: none; stroke: #888c83; stroke-width: 1; }
    #equipment-rmg .material { fill: none; stroke: #646860; stroke-width: 3; }
    #equipment-rmg .pipe { fill: none; stroke: #353832; stroke-width: 10; }
    #equipment-rmg .pipe-inner { fill: none; stroke: #eeeee8; stroke-width: 6.5; }
    #equipment-rmg .paper-line { fill: none; stroke: #faf9f6; stroke-width: 1; }
    #equipment-rmg .marker { fill: #faf9f6; stroke: #252624; stroke-width: 1.5; }
    #equipment-rmg .number { fill: #252624; font: 600 13px Arial, sans-serif; text-anchor: middle; }
  </style>
