    #equipment-truck .paper-line { fill: none; stroke: #faf9f6; stroke-width: 1; }
    #equipment-truck .marker { fill: #faf9f6; stroke: #252624; stroke-width: 1.5; }
    #equipment-truck .number { fill: #252624; font: 600 13px Arial, sans-serif; text-anchor: middle; }
