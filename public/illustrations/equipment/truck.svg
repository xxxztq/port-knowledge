  <title id="equipment-truck-title">集装箱集卡 · 教学示意，非工程图</title>
  <desc id="equipment-truck-desc">集装箱牵引车与长挂车的侧向透视，驾驶室、挂车连接部和成组车轮分明，箱体位于挂车承载面上。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-truck；不含尺寸、型号或额定能力。</metadata>
