  <title id="equipment-empty-handler-title">空箱堆高机 · 教学示意，非工程图</title>
  <desc id="equipment-empty-handler-desc">立式门架空箱堆高机，门架前方的侧向取箱横梁连接箱体，左侧另画空箱堆位作为作业背景。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-empty-handler；不含尺寸、型号或额定能力。</metadata>
