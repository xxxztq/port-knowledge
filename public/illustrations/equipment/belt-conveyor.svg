  <title id="equipment-belt-conveyor-title">皮带输送机 · 教学示意，非工程图</title>
  <desc id="equipment-belt-conveyor-desc">带料斗的倾斜皮带输送机，支腿与桁架支承上下带面，右侧通过溜槽把物料交给下一段水平皮带；局部结构简化。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-conveyor；不含尺寸、型号或额定能力。</metadata>
