    #equipment-gate-system path, #equipment-gate-system rect, #equipment-gate-system circle, #equipment-gate-system polygon, #equipment-gate-system ellipse { stroke: #252624; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
