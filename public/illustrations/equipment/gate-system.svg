<svg xmlns="http://www.w3.org/2000/svg" id="equipment-gate-system" width="800" height="480" viewBox="0 0 800 480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="equipment-gate-system-title equipment-gate-system-desc">
  <title id="equipment-gate-system-title">闸口系统 · 教学示意，非工程图</title>
  <desc id="equipment-gate-system-desc">单车道闸口系统示意：识别门架跨越载箱车辆，车道中画称重区域，侧面设信息终端，前方横杆表示通行执行设备。 教学示意，非工程图；结构、比例与配置经过简化，不代表具体型号或现场操作方案。编号1、2、3对应页面知识点。</desc>
  <metadata>原创港口设备结构插图；知识依据：src/data/knowledge.js，eq-gate；不含尺寸、型号或额定能力。</metadata>
  <style>
