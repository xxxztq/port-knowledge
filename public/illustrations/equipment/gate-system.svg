    #equipment-gate-system .shade { fill: #d8d9d2; }
    #equipment-gate-system .mid { fill: #969992; }
    #equipment-gate-system .dark { fill: #363834; }
    #equipment-gate-system .ground { fill: none; stroke: #a8aaa2; stroke-width: .85; }
    #equipment-gate-system .water { fill: none; stroke: #92968e; stroke-width: .85; }
    #equipment-gate-system .route { fill: none; stroke: #92968e; stroke-width: 1; }
    #equipment-gate-system .leader { fill: none; stroke: #888c83; stroke-width: 1; }
    #equipment-gate-system .material { fill: none; stroke: #646860; stroke-width: 3; }
    #equipment-gate-system .pipe { fill: none; stroke: #353832; stroke-width: 10; }
    #equipment-gate-system .pipe-inner { fill: none; stroke: #eeeee8; stroke-width: 6.5; }
    #equipment-gate-system .paper-line { fill: none; stroke: #faf9f6; stroke-width: 1; }
    #equipment-gate-system .marker { fill: #faf9f6; stroke: #252624; stroke-width: 1.5; }
    #equipment-gate-system .number { fill: #252624; font: 600 13px Arial, sans-serif; text-anchor: middle; }
  </style>
