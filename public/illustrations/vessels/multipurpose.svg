<svg xmlns="http://www.w3.org/2000/svg" id="v-multipurpose" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-multipurpose-title v-multipurpose-desc">
  <title id="v-multipurpose-title">多用途船：自带船吊、混合件杂货、舱口与舱内</title>
  <desc id="v-multipurpose-desc">配有船吊的多用途船示例。甲板上的箱形件、长构件和卷形件表达多种件杂货，舱口表达舱内装载空间。此处船吊只用于辨识结构，不示范起吊工法。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
