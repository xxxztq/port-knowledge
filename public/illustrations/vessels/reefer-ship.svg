<svg xmlns="http://www.w3.org/2000/svg" id="v-reefer-ship" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-reefer-ship-title v-reefer-ship-desc">
  <title id="v-reefer-ship-title">冷藏船：保温冷藏货舱、温控辅助系统、温度记录概念</title>
  <desc id="v-reefer-ship-desc">以专用冷藏货舱、保温边界和温控辅助系统示意传统冷藏船，区别于仅在甲板装载冷藏集装箱的示例。局部剖视中的小箱表示托盘或箱装货，雪花为温控概念符号，不表示温度设定或冷媒管路方案。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
  <defs><style>.v-reefer-ship-paper{fill:#f7f5ef}.v-reefer-ship-shade{fill:#e5e8df}.v-reefer-ship-wash{fill:#edf0e9}.v-reefer-ship-dark{fill:#526760}.v-reefer-ship-accent{fill:#285b56}.v-reefer-ship-ink{fill:none;stroke:#202827;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.v-reefer-ship-fine{fill:none;stroke:#7a8580;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}.v-reefer-ship-faint{fill:none;stroke:#b9bdb5;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}.v-reefer-ship-teal{fill:none;stroke:#285b56;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.v-reefer-ship-dash{stroke-dasharray:4 4}.v-reefer-ship-text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#202827}.v-reefer-ship-heading{font-size:20px;font-weight:600}.v-reefer-ship-label{font-size:14px}.v-reefer-ship-small{font-size:12px}.v-reefer-ship-tiny{font-size:11px}.v-reefer-ship-muted{fill:#596360}.v-reefer-ship-number{font-family:Arial,sans-serif;font-size:11px;font-weight:600;fill:#285b56}.v-reefer-ship-ink.v-reefer-ship-paper,.v-reefer-ship-fine.v-reefer-ship-paper,.v-reefer-ship-teal.v-reefer-ship-paper{fill:#f7f5ef}.v-reefer-ship-ink.v-reefer-ship-shade,.v-reefer-ship-fine.v-reefer-ship-shade{fill:#e5e8df}.v-reefer-ship-ink.v-reefer-ship-wash,.v-reefer-ship-fine.v-reefer-ship-wash{fill:#edf0e9}</style></defs>
