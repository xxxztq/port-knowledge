<svg xmlns="http://www.w3.org/2000/svg" id="v-oil-tanker" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-oil-tanker-title v-oil-tanker-desc">
  <title id="v-oil-tanker-title">油轮：甲板液货管系、集中歧管区、货油舱剖视</title>
  <desc id="v-oil-tanker-desc">以沿甲板布置的液货管系、集中歧管区和舷侧局部货油舱剖视示意油轮。舱数、管路连接及阀件仅作结构认知，不对应真实装卸流程或舱容。不能据此判断船舶适装货物。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
