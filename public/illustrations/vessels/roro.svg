<svg xmlns="http://www.w3.org/2000/svg" id="v-roro" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-roro-title v-roro-desc">
  <title id="v-roro-title">滚装船：尾跳板、车辆甲板剖视、轮式货物</title>
  <desc id="v-roro-desc">以尾跳板、车辆甲板和轮式货物表达滚装运输。舷侧切开一小段便于看见车辆，实际船体并非敞开；图中选用货运滚装船示例，跳板位置和甲板层数并不固定。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
