<svg xmlns="http://www.w3.org/2000/svg" id="v-semi-submersible" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-semi-submersible-title v-semi-submersible-desc">
  <title id="v-semi-submersible-title">半潜运输船：开放运输甲板、海上大型模块、可下潜甲板概念</title>
  <desc id="v-semi-submersible-desc">半潜运输船拥有可下潜的开放运输甲板，承运海上大型模块。图为装载关系示意，实线为示意航行水线，灰绿虚线为另一压载状态下的水面概念线；不是同一时刻的两条真实水面。船体保持水面船形态，非潜艇。不表示实际浮装过程、吃水或压载顺序。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
