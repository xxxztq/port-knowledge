<svg xmlns="http://www.w3.org/2000/svg" id="v-chemical-tanker" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-chemical-tanker-title v-chemical-tanker-desc">
  <title id="v-chemical-tanker-title">化学品船：多舱分隔示意、分组管线、舱口与管系对应</title>
  <desc id="v-chemical-tanker-desc">以较多独立小货舱及多组甲板管线示意化学品运输船的一种布置。分隔表达不同货物批次与相应舱室管系的管理关系，并不意味着任意货物可同时承运；舱数、管线复杂度或外观不是判别船型和适装性的规则。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
