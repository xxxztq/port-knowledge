<svg xmlns="http://www.w3.org/2000/svg" id="v-heavy-lift" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-heavy-lift-title v-heavy-lift-desc">
  <title id="v-heavy-lift-title">重吊船：重型船吊、大型项目件、船吊结构底座</title>
  <desc id="v-heavy-lift-desc">以大型船吊、加宽底座和放置在甲板上的大型工艺模块区分重吊船与普通多用途船。项目件处于静置状态，吊钩不连接货物；不提供联合起吊、支承或绑扎方案。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
