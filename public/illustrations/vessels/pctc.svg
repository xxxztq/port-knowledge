<svg xmlns="http://www.w3.org/2000/svg" id="v-pctc" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-pctc-title v-pctc-desc">
  <title id="v-pctc-title">汽车运输船：高大封闭船体、多层车辆甲板、车辆进出跳板</title>
  <desc id="v-pctc-desc">以高大封闭船体和多层车辆甲板示意汽车及卡车运输船。局部剖视显示多层车库而非真实露天开口；此处层数、车辆大小与跳板位置均为示意。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
