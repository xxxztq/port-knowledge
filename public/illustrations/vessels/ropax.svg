<svg xmlns="http://www.w3.org/2000/svg" id="v-ropax" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-ropax-title v-ropax-desc">
  <title id="v-ropax-title">客滚船：旅客上层建筑、下部车辆甲板、滚装跳板</title>
  <desc id="v-ropax-desc">以连续客舱窗、旅客上层建筑、救生艇和下部车辆甲板示意客滚船。车辆甲板为局部剖视，表达客运与滚装运输在同一艘船上的关系，不表示实际客货流线。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
