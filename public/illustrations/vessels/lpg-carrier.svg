<svg xmlns="http://www.w3.org/2000/svg" id="v-lpg-carrier" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-lpg-carrier-title v-lpg-carrier-desc">
  <title id="v-lpg-carrier-title">液化石油气船：卧式压力罐示例、甲板管路、驾驶与生活区</title>
  <desc id="v-lpg-carrier-desc">液化石油气船选用卧式压力罐作为代表性示例，表达储罐和甲板管系的关系。LPG船还包括半冷半压、全冷式等不同储运形式，实际罐体可能主要位于船体内；罐型只是代表，不是判别LNG或LPG船的规则。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
