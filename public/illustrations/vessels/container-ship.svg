<svg xmlns="http://www.w3.org/2000/svg" id="v-container-ship" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-container-ship-title v-container-ship-desc">
  <title id="v-container-ship-title">集装箱船：甲板箱格、舱内定位、驾驶与生活区</title>
  <desc id="v-container-ship-desc">以箱形货物规则排列、箱格定位和船尾驾驶区示意集装箱船。舱内格栅以局部剖视表达，箱数与堆层仅为绘图需要，不表示允许积载。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
