<svg xmlns="http://www.w3.org/2000/svg" id="v-deck-carrier" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-deck-carrier-title v-deck-carrier-desc">
  <title id="v-deck-carrier-title">甲板运输船：连续货物甲板、大型桁架构件、集中上层建筑</title>
  <desc id="v-deck-carrier-desc">以连续平坦货物甲板、集中在一端的上层建筑与大型桁架构件示意甲板运输船。这里画的是普通甲板承运关系，不表示该船具备半潜装载功能；构件支承只表达空间关系。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
  <defs><style>.v-deck-carrier-paper{fill:#f7f5ef}.v-deck-carrier-shade{fill:#e5e8df}.v-deck-carrier-wash{fill:#edf0e9}.v-deck-carrier-dark{fill:#526760}.v-deck-carrier-accent{fill:#285b56}.v-deck-carrier-ink{fill:none;stroke:#202827;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.v-deck-carrier-fine{fill:none;stroke:#7a8580;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}.v-deck-carrier-faint{fill:none;stroke:#b9bdb5;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}.v-deck-carrier-teal{fill:none;stroke:#285b56;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.v-deck-carrier-dash{stroke-dasharray:4 4}.v-deck-carrier-text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#202827}.v-deck-carrier-heading{font-size:20px;font-weight:600}.v-deck-carrier-label{font-size:14px}.v-deck-carrier-small{font-size:12px}.v-deck-carrier-tiny{font-size:11px}.v-deck-carrier-muted{fill:#596360}.v-deck-carrier-number{font-family:Arial,sans-serif;font-size:11px;font-weight:600;fill:#285b56}.v-deck-carrier-ink.v-deck-carrier-paper,.v-deck-carrier-fine.v-deck-carrier-paper,.v-deck-carrier-teal.v-deck-carrier-paper{fill:#f7f5ef}.v-deck-carrier-ink.v-deck-carrier-shade,.v-deck-carrier-fine.v-deck-carrier-shade{fill:#e5e8df}.v-deck-carrier-ink.v-deck-carrier-wash,.v-deck-carrier-fine.v-deck-carrier-wash{fill:#edf0e9}</style></defs>
