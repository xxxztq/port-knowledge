<svg xmlns="http://www.w3.org/2000/svg" id="v-bulk-carrier" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-bulk-carrier-title v-bulk-carrier-desc">
  <title id="v-bulk-carrier-title">散货船：宽大舱盖、独立货舱、连续舱口布置</title>
  <desc id="v-bulk-carrier-desc">宽大舱口与舱盖对应连续布置的散货货舱。舷侧局部剖视用颗粒堆形表达散装货物，画的是无船吊示例；散货船也可配置船吊，不能仅凭船吊有无判断船型。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
