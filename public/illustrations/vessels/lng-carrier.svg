<svg xmlns="http://www.w3.org/2000/svg" id="v-lng-carrier" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="v-lng-carrier-title v-lng-carrier-desc">
  <title id="v-lng-carrier-title">液化天然气船：球罐代表型式、甲板管路、驾驶与生活区</title>
  <desc id="v-lng-carrier-desc">液化天然气船以球形液货围护系统作为代表性画法，绘出储罐、甲板管路与船尾生活驾驶区。球罐并非LNG船的唯一储罐型式，LNG船也常采用膜式等围护系统；图中的罐型只是代表，不是判别LNG或LPG船的规则。 原创工程科普线稿；教学示意，不按比例，不表示实际船舶总布置、工程尺寸或作业方案。</desc>
